# Foundry configuration for the Bandung Base Builders staking workshop.
# Reference: https://book.getfoundry.sh/reference/config/

[profile.default]
src             = "src"
out             = "out"
libs            = ["lib"]
test            = "test"
script          = "script"
cache_path      = "cache"
solc_version    = "0.8.24"
optimizer       = true
optimizer_runs  = 200
via_ir          = false
evm_version     = "paris"           # Base Sepolia is paris-compatible
auto_detect_solc = false
remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/",
    "forge-std/=lib/forge-std/src/",
]
fs_permissions = [
    { access = "read", path = "./" },
    { access = "read-write", path = "./broadcast" }
]
verbosity = 2

[profile.ci]
verbosity      = 3
fuzz.runs      = 1024
invariant.runs = 256

# ---------------------------------------------------------------------------
# RPC endpoints. Values use shell env-var interpolation (`${VAR}`).
# Put real values in the repo-root `.env` file (gitignored).
# ---------------------------------------------------------------------------
[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
anvil        = "http://127.0.0.1:8545"

# ---------------------------------------------------------------------------
# Etherscan / Basescan verification.
# Basescan uses an Etherscan-compatible API. Same key works for mainnet
# and Sepolia: https://basescan.org/myapikey
# ---------------------------------------------------------------------------
[etherscan]
base_sepolia = { key = "${BASESCAN_API_KEY}", chain = 84532, url = "https://api-sepolia.basescan.org/api" }

[fmt]
line_length         = 120
tab_width           = 4
bracket_spacing     = true
int_types           = "long"
quote_style         = "double"
number_underscore   = "thousands"
multiline_func_header = "all"
